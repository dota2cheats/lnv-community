<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Блатное Казино LNV</title>
    <style>
        body { background: #121212; color: #fff; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; border: 3px solid #333; padding: 20px; background: #1a1a1a; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        h1 { color: #e47c1a; text-shadow: 2px 2px #000; }
        button { background: #e47c1a; color: white; border: none; padding: 10px 20px; font-size: 18px; cursor: pointer; font-weight: bold; margin: 10px; }
        button:hover { background: #e47c1a; }
        .balance-box { font-size: 20px; margin: 20px 0; color: #5cb85c; }
        .game-section { display: none; margin-top: 30px; border-top: 1px solid #333; padding-top: 20px; }
        .reels { font-size: 50px; letter-spacing: 15px; margin: 15px 0; background: #000; padding: 10px; display: inline-block; border-radius: 5px; }
        input { background: #222; color: #fff; border: 1px solid #444; padding: 8px; font-size: 16px; width: 100px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1> КАЗИНО "ОБЩАК LNV" </h1>
    
    <!-- Авторизация -->
    <div id="auth-block">
        <p>Чтобы крутить рулетку и слоты, обоснуй кто ты по жизни:</p>
        <button onclick="loginDiscord()">Войти через Discord</button>
    </div>

    <!-- Игровая панель -->
    <div id="game-block" style="display:none;">
        <p>Добро пожаловать в хату, <b id="user-name">Арестант</b>!</p>
        <div class="balance-box">Твоя заначка: <span id="user-balance">0</span> 🚬</div>
        
        <label>Ставка (сигарет): </label>
        <input type="number" id="bet-amount" value="10" min="1">

        <!-- СЛОТЫ -->
        <div class="game-section" style="display:block;">
            <h3>ОДНОРУКИЙ БАНДЮГАН</h3>
            <div class="reels" id="slots-reels">🎲🎲🎲</div><br>
            <button onclick="play('slots')">Дёрнуть рычаг</button>
        </div>

        <!-- РУЛЕТКА -->
        <div class="game-section" style="display:block;">
            <h3>АРЕСТАНТСКАЯ РУЛЕТКА</h3>
            <p>Красное(x2) | Черное(x2) | Зеленое(x35)</p>
            <button onclick="play('roulette_red')" style="background:#d9534f;">Красное</button>
            <button onclick="play('roulette_black')" style="background:#222; border:1px solid #555;">Черное</button>
            <button onclick="play('roulette_zero')" style="background:#5cb85c;">Зеленое</button>
            <div id="roulette-result" style="margin-top:15px; font-size:18px;"></div>
        </div>
    </div>
</div>

<script>
    // НАСТРОЙКИ СВЯЗИ (Замени на свои)
    const CLIENT_ID = "1569821348069511298"; 
    const REDIRECT_URI = "https://dota2cheats.github.io/lnv-community/luding.html";
    const BACKEND_URL = "http://localhost:8000"; // Когда зальешь бота в облако, поменяешь этот адрес

    let userData = { id: null, username: "" };

    function loginDiscord() {
        const url = "https://discord.com/oauth2/authorize?client_id=" + CLIENT_ID + "&response_type=token&redirect_uri=" + encodeURIComponent(REDIRECT_URI) + "&scope=identify";
        window.location.href = url;
    }


    // Логика захвата токена Дискорда после входа
    // Логика захвата токена Дискорда после входа
    window.onload = function() {
        const hash = window.location.hash;
        if (hash.includes("access_token")) {
            const token = new URLSearchParams(hash.replace("#", "?")).get("access_token");
            
            const apiBase = "https://discord.com";
            const apiPath = "/api/users/@me";
            
            fetch(apiBase + apiPath, {
                headers: { Authorization: "Bearer " + token }
            })
            .then(res => res.json())
            .then(data => {
                userData.id = data.id;
                userData.username = data.username;
                document.getElementById("user-name").innerText = data.username;
                document.getElementById("auth-block").style.display = "none";
                document.getElementById("game-block").style.display = "block";
                updateBalance();
            });
        }
    }


    function updateBalance() {
        fetch(`${BACKEND_URL}/api/balance/${userData.id}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById("user-balance").innerText = data.cigarettes;
            }).catch(() => alert("Бот-сервер спит или не запущен!"));
    }

    function play(gameType) {
        const bet = parseInt(document.getElementById("bet-amount").value);
        if(!bet || bet <= 0) return alert("Ставь правильное количество сигарет!");

        fetch(`${BACKEND_URL}/api/play`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                user_id: userData.id,
                username: userData.username,
                bet: bet,
                type: gameType
            })
        })
        .then(res => {
            if(!res.ok) return res.json().then(err => { throw new Error(err.detail) });
            return res.json();
        })
        .then(data => {
            if(data.game === 'slots') {
                document.getElementById("slots-reels").innerText = data.reels.join("");
            } else if(data.game === 'roulette') {
                const colorText = data.color === 'red' ? 'Красное' : data.color === 'black' ? 'Черное' : 'Нулина';
                document.getElementById("roulette-result").innerText = `Выпало: Число ${data.number} (${colorText})`;
            }
            
            document.getElementById("user-balance").innerText = data.balance;
            if(data.win) {
                alert(`Фартануло! Поднял куш: +${data.win_amount} 🚬`);
            } else {
                alert("Сиги ушли в общак.");
            }
        })
        .catch(err => alert(err.message));
    }
</script>
</body>
</html>
